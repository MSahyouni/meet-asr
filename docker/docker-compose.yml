version: "3.9"
services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: meetasr-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./voices:/app/voices
    gpus: all

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: meetasr-web
    environment:
      - ASR_API_URL=http://api:8000/transcribe
      - ASR_BATCH_URL=http://api:8000/transcribe-batch
      - ASR_SUMMARY_URL=http://api:8000/summarize
      - ASR_HTTP_TIMEOUT=300
    ports:
      - "7860:7860"
    depends_on:
      - api
    volumes:
      - ./data:/app/data
