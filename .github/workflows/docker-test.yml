name: 🧪 Docker Build & Health Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t meetasr-api-test .

      - name: Build Web image
        run: docker build -f docker/Dockerfile.web -t meetasr-web-test .

      - name: Start API container
        run: |
          docker run -d --name meetasr-api-test -p 8000:8000 meetasr-api-test
          sleep 20
          curl -f http://127.0.0.1:8000/health || (docker logs meetasr-api-test && exit 1)

      - name: Clean up
        if: always()
        run: docker rm -f meetasr-api-test || true
