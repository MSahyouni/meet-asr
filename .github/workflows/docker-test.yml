name: 🧪 Docker Build & Health Check

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: docker-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          sudo docker system prune -af || true

      - name: Build API image (cache + load)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          tags: meetasr-api-test:latest
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect API image
        run: |
          docker image inspect meetasr-api-test:latest --format 'Entrypoint={{json .Config.Entrypoint}} Cmd={{json .Config.Cmd}}'

      - name: Start API container
        run: |
          docker run -d --name meetasr-api-test -p 8000:8000 \
            -e MODELS_DIR=/tmp/models \
            -e OUTPUTS_DIR=/tmp/outputs \
            -e SPK_DIR=/tmp/voices \
            meetasr-api-test:latest

      - name: Health check (retry)
        run: |
          set -e
          for i in {1..40}; do
            if curl -sf http://127.0.0.1:8000/health >/dev/null; then
              echo "OK"
              exit 0
            fi
            sleep 3
          done
          echo "Health check failed. Logs:"
          docker logs meetasr-api-test || true
          exit 1

      - name: Dump logs on failure
        if: failure()
        run: docker logs meetasr-api-test || true

      - name: Clean up
        if: always()
        run: docker rm -f meetasr-api-test || true
