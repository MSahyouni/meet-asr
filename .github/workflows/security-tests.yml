name: Security Tests

on:
  workflow_dispatch:
  push:
    branches: [nabra, main, master]
  pull_request:
    branches: [nabra, main, master]

concurrency:
  group: security-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secure-endpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-security-${{ hashFiles('apps/api/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-security-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install pytest

      - name: Run security-focused tests
        env:
          JWT_SECRET: ci-local-secret
          JWT_EXPIRES_SECONDS: 86400
          JWT_ISSUER: meet-asr
          JWT_AUDIENCE: meet-asr-api
          ADMIN_EMAILS: admin@local
        run: |
          pytest -q tests/test_auth_security.py tests/test_secure_endpoints.py
