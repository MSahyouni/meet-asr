name: CI

on:
  workflow_dispatch:
  push:
    branches: [nabra, main, master]
  pull_request:
    branches: [nabra, main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JWT_SECRET: ci-local-secret
      JWT_EXPIRES_SECONDS: 86400
      JWT_ISSUER: meet-asr
      JWT_AUDIENCE: meet-asr-api
      ADMIN_EMAILS: admin@local
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('apps/api/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install pytest

      - name: Run tests
        working-directory: apps/api
        env:
          PYTHONPATH: .
        run: |
          pytest -q ../../tests/ --ignore=scripts/test_tts_asr_live.py
