[pytest]
filterwarnings =
    ignore:.*pkg_resources is deprecated as an API.*:UserWarning
    ignore:.*TRANSFORMERS_CACHE.*deprecated.*:FutureWarning
    ignore:.*declare_namespace\('google'\).*:DeprecationWarning
    ignore:.*declare_namespace\('pyannote'\).*:DeprecationWarning
    ignore:.*SwigPyPacked.*:DeprecationWarning
    ignore:.*SwigPyObject.*:DeprecationWarning
    ignore:.*swigvarlink.*:DeprecationWarning
