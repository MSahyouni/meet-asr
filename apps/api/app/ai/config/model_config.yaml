# ASR Models
asr:
  whisper:
    model_id: "Systran/faster-whisper"
    size: "large-v3"
    device: "auto"

# TTS Engines (Habibi only)
tts:
  habibi:
    model_id: "SWivid/Habibi-TTS"
    voices:
      - habibi_unified
      - habibi_specialized

# NLP Models
nlp:
  summarizer:
    model_id: "inceptionai/Jais-2-8B-Chat"
    mode: "jais"

  embeddings:
    model_id: "intfloat/multilingual-e5-base"
